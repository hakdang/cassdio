name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Test
        run: ./gradlew test ktlintCheck

      - name: Build
        run: ./gradlew :cassdio-web:bootJar

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: cassdio-backend
          path: cassdio-web/build/libs/cassdio.jar
