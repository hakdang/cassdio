spring:
  application:
    name: cassdio-web

cassdio:
  version: 0.1.0
  metadata:
    cassandra:
      contact-points:
        - 127.0.0.1
      port: 9042
      local-datacenter: datacenter1
      keyspace: cassdio_meta
      tls-enabled: false
    bootstrap:
      enabled: false
      owner: cassdio-web
      cassdio-version: 0.1.0
      replication:
        strategy: SIMPLE
        factor: 1
      durable-writes: true
      lock-ttl-seconds: 300

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
