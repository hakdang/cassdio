services:
  cassandra:
    image: cassandra:${CASSANDRA_VERSION:-5.0}
    container_name: cassdio-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: cassdio-local
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    volumes:
      - cassandra-data:/var/lib/cassandra

  cassandra-init:
    image: cassandra:${CASSANDRA_VERSION:-5.0}
    container_name: cassdio-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./docker/init:/docker/init:ro
    command: ["cqlsh", "cassandra", "9042", "-f", "/docker/init/init.cql"]
    restart: "no"

volumes:
  cassandra-data:
